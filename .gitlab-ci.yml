---
build:
  stage: build
  image:
    name: quay.io/containers/buildah:latest
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
    BUILDAH_ISOLATION: chroot
    FQ_IMAGE_COMMIT: "$CI_REGISTRY_IMAGE/$CI_PROJECT_NAME:$CI_COMMIT_SHA"
    FQ_IMAGE_LATEST: "$CI_REGISTRY_IMAGE/$CI_PROJECT_NAME:latest"
  before_script:
    - buildah login -u $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - buildah build -t $FQ_IMAGE_COMMIT
    - buildah tag $FQ_IMAGE_COMMIT $FQ_IMAGE_LATEST
    - buildah push $FQ_IMAGE_COMMIT
    - buildah push $FQ_IMAGE_LATEST
